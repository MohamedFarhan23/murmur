# Checks that Murmur builds from a clean checkout: analyzes, runs the unit
# tests and builds the arm64 APK, attached to the run as an artifact.
# Release signing stays on the maintainer's machine, so this APK is
# debug-signed: fine for testing, but it won't install over a release build.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # The weights aren't in the repo; fetch_model.sh pins and verifies them.
      - uses: actions/cache@v4
        with:
          path: app/assets/models/whistle.cact
          key: whistle-${{ hashFiles('app/tool/fetch_model.sh') }}
      - run: tool/fetch_model.sh

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - run: >-
          flutter build apk --release
          --target-platform android-arm64
          --split-debug-info=build/symbols

      - uses: actions/upload-artifact@v4
        with:
          name: murmur-${{ github.sha }}-arm64
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
